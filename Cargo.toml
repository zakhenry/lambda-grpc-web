[workspace]
members = [
    ".",
    "examples/hello-world", "examples/server-streaming", "examples/envoy", "integration",
]

[package]
name = "lambda-grpc-web"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zakhenry/lambda-grpc-web"
description = "grpc-web framed tonic service adaptor to aws lambda runtime"

[lib]
name = "lambda_grpc_web"
path = "src/lib.rs"

# docs.rs builds with default features, which select no transport and so would hit the
# `compile_error!` in `src/lib.rs`. The features are additive, so everything can simply be on.
[package.metadata.docs.rs]
all-features = true
# turns on the `doc(cfg(..))` badges that label which feature gates each item
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["catch-panic", "deadline"]
catch-panic = []
deadline = []
wire-log = ["dep:http-body", "dep:http-body-util", "dep:bytes"]

# Transports are additive, and there is deliberately no default - which envelope a lambda receives
# is a deployment decision, so it has to be made explicitly. Enabling both is supported (a
# workspace may well have a function behind each); the one a given server uses is picked by calling
# `serve_apigw_http` or `serve_envoy`. See the `compile_error!` in `src/lib.rs` for the one
# combination that is rejected: none at all.
# API Gateway HTTP API (v2) event payload, streamed with the `RESPONSE_STREAM` invoke mode.
transport-apigw-http = ["dep:lambda_http", "dep:http-body", "dep:bytes"]
# Envoy `aws_lambda` http filter envelope, buffered with the `BUFFERED` invoke mode.
transport-envoy = [
    "dep:serde",
    "dep:serde_json",
    "dep:base64",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
]

[dependencies]
lambda_http = { version = "1.0.1", features = ["apigw_http"], optional = true }
lambda_runtime = "1.0.1"
tonic = "0.14.2"
tonic-web = "0.14.2"
tower-http = { version = "0.6.8", features = ["catch-panic"] }
tower = "0.5.2"
tokio = "1.48.0"
http = "1.4.0"
axum = "0.8.8"

http-body = { version = "1.0.1", optional = true }
http-body-util = { version = "0.1.3", optional = true }
bytes = { version = "1.11.0", optional = true }

serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
base64 = { version = "0.22.1", optional = true }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt"] }

[patch.crates-io]
#tonic-web = { path = "../tonic/tonic-web" }
#tonic = { path = "../tonic/tonic"}
# revert when https://github.com/hyperium/tonic/pull/2474 is merged
tonic-web = { git = "https://github.com/zakhenry/tonic", rev = "c3d84d77db4803ef54948aab4fe97c67150329ce" }
tonic = { git = "https://github.com/zakhenry/tonic", rev = "c3d84d77db4803ef54948aab4fe97c67150329ce" }
